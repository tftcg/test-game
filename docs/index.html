<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transformers TCG prototype mockup</title>
  <script type="importmap">
    {
      "imports": {
        "#deck-load": "./DeckLoadWeb.js"
      }
    }
  </script>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #11161d;
      color: #e7edf4;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 1180px; }
    button { font: inherit; }

    .page-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: .75rem 1rem;
      background: #202a35;
      border-bottom: 1px solid #425264;
    }

    .page-header h1 { margin: 0; font-size: 1.15rem; }
    #status { margin: 0; color: #a9cce8; }

    .game-layout {
      display: grid;
      grid-template-columns: 230px minmax(950px, 1fr);
      gap: .75rem;
      padding: .75rem;
      min-height: calc(100vh - 58px);
    }

    .control-column, .player-mat {
      background: #1a222c;
      border: 1px solid #40505f;
      border-radius: .4rem;
    }

    .control-column {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto auto;
      gap: .75rem;
      align-self: start;
      position: sticky;
      top: .75rem;
      height: calc(100vh - 73px);
      min-width: 0;
      padding: .75rem;
      overflow: hidden;
    }

    .panel-title { margin: 0 0 .5rem; font-size: .82rem; text-transform: uppercase; letter-spacing: .06em; color: #9fb2c5; }
    #gameplay-events {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-height: 0;
    }
    #gameplay-event-log {
      margin: 0;
      min-height: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      overflow-y: auto;
      font: .8rem/1.4 ui-monospace, monospace;
    }
    #turn-actions, #action-buttons { min-width: 0; }
    #action-buttons {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: .45rem;
      width: 100%;
    }
    #action-buttons button, #choice-confirm {
      min-width: 0;
      max-width: 100%;
      padding: .55rem;
      color: inherit;
      background: #263748;
      border: 1px solid #6687a5;
      border-radius: .25rem;
      cursor: pointer;
      overflow-wrap: anywhere;
    }
    #action-buttons button:hover, #choice-confirm:hover { background: #35506a; }
    #choice-options { display: grid; gap: .35rem; margin-bottom: .5rem; font-size: .85rem; }

    #game-state { display: grid; gap: .75rem; min-width: 0; }
    .player-mat {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr) 130px;
      grid-template-rows: 78px minmax(260px, 1fr) 136px;
      gap: .55rem;
      min-height: 480px;
      padding: .55rem;
    }

    .player-mat.opponent { transform: rotate(180deg); }
    .mat-zone {
      position: relative;
      min-width: 0;
      overflow: hidden;
      background: #202b36;
      border: 1px solid #495d70;
      border-radius: .25rem;
      padding: .3rem;
    }
    .zone-label {
      display: block;
      margin-bottom: .25rem;
      color: #aebdca;
      font-size: .65rem;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .stratagems { grid-column: 1; grid-row: 1; }
    .characters { grid-column: 2; grid-row: 1 / span 2; }
    .ko { grid-column: 3; grid-row: 1; }
    .previous-flips { grid-column: 1; grid-row: 3; }
    .actions { grid-column: 3; grid-row: 2; }
    .latest-flips { grid-column: 1; grid-row: 2; }
    .hand { grid-column: 2; grid-row: 3; }
    .deck-scrap { grid-column: 3; grid-row: 3; display: grid; grid-template-columns: 1fr 1fr; gap: .35rem; }

    .card-row { display: flex; align-items: flex-start; gap: .4rem; min-width: max-content; }
    .card-row.scrollable { overflow-x: auto; min-width: 100%; height: calc(100% - 1.2rem); }
    .character-row { display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: .75rem; height: calc(100% - 1.2rem); overflow: auto; }
    .character-stack { display: grid; grid-template-rows: 170px 50px; justify-items: center; min-width: 126px; }

    .card {
      position: relative;
      flex: 0 0 auto;
      width: 74px;
      height: 104px;
      padding: 0;
      overflow: hidden;
      background: #10151b;
      border: 1px solid #8298aa;
      border-radius: .2rem;
      cursor: zoom-in;
    }
    .card img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .card.small { width: 42px; height: 59px; }
    .card.character { width: 120px; height: 168px; }
    .card.tapped { transform: rotate(-90deg) scale(.78); }
    .card-code {
      position: absolute;
      right: .15rem;
      bottom: .12rem;
      padding: .08rem .16rem;
      color: white;
      background: rgb(0 0 0 / 75%);
      font-size: .55rem;
      line-height: 1;
    }
    .card-statline {
      position: absolute;
      right: .2rem;
      bottom: .2rem;
      padding: .14rem .22rem;
      color: white;
      background: rgb(0 0 0 / 78%);
      font-size: .6rem;
    }
    .card-statline.damage { color: #ff9d9d; }

    .upgrade-row { display: flex; justify-content: center; gap: .25rem; width: 100%; }
    .upgrade-slot { width: 38px; min-height: 48px; text-align: center; font-size: .55rem; color: #9eabb7; }
    .upgrade-slot .card { margin-top: .1rem; }
    .empty-slot { display: block; height: 42px; border: 1px dashed #536474; border-radius: .15rem; }

    .pile { display: flex; align-items: flex-start; min-width: max-content; }
    .pile .card + .card { margin-left: -46px; }
    .pile .card.small + .card.small { margin-left: -25px; }
    .latest-flip-strip { height: calc(100% - 1.2rem); overflow: auto; }
    .latest-flip-strip .card + .card { margin-left: -59px; }
    .previous-flip-placeholder { display: grid; place-items: center; height: calc(100% - 1.2rem); color: #718497; font-size: .7rem; text-align: center; }
    .deck-count { position: absolute; right: .4rem; bottom: .3rem; z-index: 1; padding: .1rem .3rem; background: #0b1016; border: 1px solid #8ea2b4; border-radius: 1rem; font-size: .75rem; }
    .deck-scrap .mat-zone { padding: .25rem; }

    #card-preview {
      position: fixed;
      z-index: 10;
      width: 280px;
      height: 392px;
      overflow: hidden;
      pointer-events: none;
      background: #090d12;
      border: 2px solid #d4e0e9;
      border-radius: .4rem;
      box-shadow: 0 12px 30px rgb(0 0 0 / 65%);
    }
    #card-preview[hidden] { display: none; }
    #card-preview img { width: 100%; height: 100%; object-fit: cover; }
    .preview-statline {
      position: absolute;
      right: .55rem;
      bottom: .55rem;
      padding: .25rem .4rem;
      color: white;
      background: rgb(0 0 0 / 78%);
      font-size: .9rem;
    }
    .preview-statline.damage { color: #ff9d9d; }
  </style>
</head>
<body>
  <header class="page-header">
    <h1>Transformers TCG prototype</h1>
    <p id="status">Loading game...</p>
  </header>
  <main class="game-layout">
    <aside class="control-column">
      <section id="gameplay-events">
        <h2 class="panel-title">Game event log</h2>
        <pre id="gameplay-event-log" aria-live="polite"></pre>
      </section>
      <section id="turn-actions" hidden>
        <h2 class="panel-title">Actions</h2>
        <div id="action-buttons"></div>
      </section>
      <section id="choice" hidden>
        <h2 id="choice-title" class="panel-title">Choose</h2>
        <p id="choice-instructions"></p>
        <div id="choice-options"></div>
        <button id="choice-confirm" type="button">Confirm choice</button>
      </section>
    </aside>
    <section id="game-state" aria-label="Game board"></section>
  </main>
  <aside id="card-preview" hidden aria-hidden="true"></aside>
  <script type="module" src="./web.js"></script>
</body>
</html>
